<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CineMatch • Sentiment Analysis</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #e5e7eb;
        }

        /* LIGHT MODE */
        body.dark-mode {
            background: #ffffff;
            color: #111827;
        }

        body.dark-mode .header {
            background: rgba(255,255,255,0.7);
            border-bottom-color: rgba(0,0,0,0.25);
        }

        /* HEADER / NAVBAR */
        .header {
            backdrop-filter: blur(14px);
            background: rgba(15, 23, 42, 0.75);
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(148,163,184,0.2);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #f97316, #ec4899);
            -webkit-background-clip: text;
            color: transparent;
            cursor: pointer;
            user-select: none;
        }

        .nav-btns {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-btn {
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #f97316, #ec4899);
            color: white;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* ✅ COMBINED USER BUTTON (PROFILE + LOGOUT) */
        .user-combo {
            display: flex;
            border-radius: 999px;
            overflow: hidden;
            background: linear-gradient(135deg, #f97316, #ec4899);
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }

        .user-combo button {
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            color: white;
            background: transparent;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .user-left {
            border-right: 1px solid rgba(255,255,255,0.4);
        }

        .user-combo button:hover {
            background: rgba(0,0,0,0.25);
            transform: translateY(-1px);
        }

        .user-right:hover {
            background: rgba(0,0,0,0.35);
        }

        /* PAGE */
        .container {
            max-width: 900px;
            margin: 60px auto;
            background: rgba(30,41,59,0.95);
            border-radius: 22px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
        }

        body.dark-mode .container {
            background: rgba(249,250,251,0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .textarea-box {
            width: 100%;
            height: 140px;
            border-radius: 16px;
            border: 1px solid rgba(148,163,184,0.4);
            background: #0f172a;
            color: white;
            padding: 16px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
        }

        body.dark-mode .textarea-box {
            background: #ffffff;
            color: #111827;
        }

        .upload-input {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            background: #0f172a;
            border: 1px solid rgba(148,163,184,0.4);
            color: white;
            margin-top: 10px;
            box-sizing: border-box;
        }

        body.dark-mode .upload-input {
            background: #ffffff;
            color: #111827;
        }

        .action-btn {
            padding: 14px 28px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            background: linear-gradient(135deg,#f97316,#ec4899);
            color: white;
            margin-top: 20px;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 16px;
            margin-top: 20px;
            display: none;
            border: 2px solid #ec4899;
        }

        .result-box {
            margin-top: 40px;
            padding: 24px;
            background: #1e293b;
            border-radius: 18px;
            display: none;
        }

        body.dark-mode .result-box {
            background: #f3f4f6;
        }

        .loader {
            width: 42px; height: 42px;
            border: 5px solid rgba(255,255,255,0.2);
            border-top: 5px solid #f97316;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .movie-card {
            width: 150px;
            text-align: center;
            background: #0f172a;
            padding: 10px;
            border-radius: 12px;
        }

        body.dark-mode .movie-card {
            background: #ffffff;
            border: 1px solid rgba(17,24,39,0.12);
        }

        .movie-title {
            font-size: 14px;
            margin-top: 8px;
            color: white;
            font-weight: bold;
        }

        body.dark-mode .movie-title {
            color: #111827;
        }
    </style>
</head>

<body>

<!-- ✅ NAVBAR (ίδιο μοτίβο με person-details) -->
<div class="header">
    <div class="logo" onclick="window.location.href='/home'">CineMatch</div>

    <div class="nav-btns">
        <button class="nav-btn" onclick="window.location.href='/trending'">Trending</button>
        <button class="nav-btn" onclick="window.location.href='/trending-celebrities'">Trending Actors</button>
        <button class="nav-btn" onclick="window.location.href='/upload'">Upload</button>
        <button class="nav-btn" onclick="window.location.href='/actor-match'">Actor Match</button>
        <button class="nav-btn" onclick="window.location.href='/sentiment'">Sentiment Search</button>
        <button class="nav-btn" onclick="window.location.href='/quiz-selection'">Quiz 🎭</button>
        <button class="nav-btn" onclick="toggleDarkMode()">𖤓</button>
        <button class="nav-btn" onclick="location.href='/history'">History</button>

        <th:block th:if="${loggedUser == null}">
            <button class="nav-btn" onclick="window.location.href='/login'">LogIn / SignUp</button>
        </th:block>

        <th:block th:if="${loggedUser != null}">
            <div class="user-combo">
                <button class="user-left" onclick="window.location.href='/profile'">
                    <span th:text="${loggedUser.fullName}">User</span>
                </button>
                <button class="user-right" onclick="window.location.href='/logout'">Logout</button>
            </div>
        </th:block>
    </div>
</div>

<div class="container">
    <h1>🎭 Sentiment Analysis</h1>

    <textarea class="textarea-box" id="userInput" placeholder="How are you feeling today?"></textarea>

    <div style="text-align: left; margin-top: 20px;">
        <label>Upload Image (optional):</label>
        <input id="fileInput" type="file" class="upload-input" accept="image/*">
    </div>

    <div class="preview-area"><img id="previewImage"></div>

    <button class="action-btn" onclick="handleAnalysis()">Analyze Everything</button>

    <div class="loader" id="loader"></div>

    <div class="result-box" id="resultBox">
        <div id="detectedEmotion" style="font-size: 22px; font-weight: bold; color: #f97316; margin-bottom: 20px;"></div>
        <div id="movieList" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;"></div>
    </div>
</div>

<script>
    // --- Dark Mode (ίδια λογική με person-details) ---
    function toggleDarkMode() {
        const body = document.body;
        const isDark = body.classList.toggle("dark-mode");
        localStorage.setItem("darkMode", isDark);
    }

    window.onload = () => {
        if (localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }
    };

    // --- Image preview ---
    const fileInput = document.getElementById("fileInput");
    const previewImage = document.getElementById("previewImage");

    fileInput.onchange = () => {
        const file = fileInput.files[0];
        if (file) {
            previewImage.src = URL.createObjectURL(file);
            previewImage.style.display = "inline-block";
        } else {
            previewImage.style.display = "none";
        }
    };

    // --- Main action ---
    async function handleAnalysis() {
        const file = fileInput.files[0];
        const text = document.getElementById("userInput").value;
        const loader = document.getElementById("loader");
        const resultBox = document.getElementById("resultBox");

        loader.style.display = "block";
        resultBox.style.display = "none";

        try {
            let res;
            if (file) {
                const formData = new FormData();
                formData.append("file", file);
                res = await fetch('/api/sentiment/analyze-image', { method: 'POST', body: formData });
            } else {
                res = await fetch('/api/sentiment/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
            }

            if (!res.ok) throw new Error("Bad response: " + res.status);

            const data = await res.json();
            renderResults(data);

        } catch (e) {
            console.error(e);
            alert("Error connecting to server! Check that /sentiment + /api/sentiment/* endpoints exist.");
        } finally {
            loader.style.display = "none";
        }
    }

    // ✅ FIX: ταιριάζει με SentimentResultDTO που φτιάχνεις (emotion + movies)
    function renderResults(data) {
  const resultBox = document.getElementById("resultBox");
  const emotionLabel = document.getElementById("detectedEmotion");
  const movieList = document.getElementById("movieList");

  resultBox.style.display = "block";

  // ✅ δέχεται ΚΑΙ emotion ΚΑΙ sentimentLabel
  const emotion = (data.emotion || data.sentimentLabel || "NEUTRAL").toString().toUpperCase();
  const icons = { SAD: "😢", EXCITED: "🤩", HAPPY: "😊", NEUTRAL: "😐" };
  emotionLabel.innerHTML = `Detected Emotion: ${icons[emotion] || "🎬"} ${emotion}`;

  // ✅ δέχεται ΚΑΙ movies ΚΑΙ recommendations
  const movies = data.movies || data.recommendations || [];

  // ✅ αν backend γυρνάει Map fields από TMDB, τα keys είναι poster_path/title
  movieList.innerHTML = (movies || []).map(movie => {
    const poster = movie.poster_path || movie.posterPath || movie.poster || "";
    const title  = movie.title || movie.name || movie.original_title || "Untitled";

    return `
      <div class="movie-card">
        <img src="https://image.tmdb.org/t/p/w200${poster}" style="width: 100%; border-radius: 8px;">
        <div class="movie-title">${title}</div>
      </div>
    `;
  }).join("");
}
</script>

</body>
</html>
