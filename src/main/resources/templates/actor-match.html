<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CineMatch • Actor Match</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #e5e7eb;
        }

        /* LIGHT MODE */
        body.dark-mode {
            background: #ffffff;
            color: #111827;
        }

        body.dark-mode .header {
            background: rgba(255,255,255,0.7);
            border-bottom-color: rgba(0,0,0,0.25);
        }

        /* HEADER / NAVBAR */
        .header {
            backdrop-filter: blur(14px);
            background: rgba(15, 23, 42, 0.75);
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(148,163,184,0.2);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #f97316, #ec4899);
            -webkit-background-clip: text;
            color: transparent;
            cursor: pointer;
            user-select: none;
        }

        .nav-btns {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-btn {
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #f97316, #ec4899);
            color: white;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* ✅ COMBINED USER BUTTON (PROFILE + LOGOUT) */
        .user-combo {
            display: flex;
            border-radius: 999px;
            overflow: hidden;
            background: linear-gradient(135deg, #f97316, #ec4899);
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }

        .user-combo button {
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            color: white;
            background: transparent;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .user-left {
            border-right: 1px solid rgba(255,255,255,0.4);
        }

        .user-combo button:hover {
            background: rgba(0,0,0,0.25);
            transform: translateY(-1px);
        }

        .user-right:hover {
            background: rgba(0,0,0,0.35);
        }

        /* PAGE */
        .container {
            max-width: 900px;
            margin: 60px auto;
            background: rgba(30,41,59,0.95);
            border-radius: 22px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
        }

        body.dark-mode .container {
            background: rgba(249,250,251,0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .upload-input {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            background: #0f172a;
            border: 1px solid rgba(148,163,184,0.4);
            color: white;
            margin-top: 10px;
            box-sizing: border-box;
        }

        body.dark-mode .upload-input {
            background: #ffffff;
            color: #111827;
        }

        .action-btn {
            padding: 14px 28px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            background: linear-gradient(135deg,#f97316,#ec4899);
            color: white;
            margin-top: 20px;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 320px;
            border-radius: 16px;
            margin-top: 20px;
            display: none;
            border: 2px solid #ec4899;
            object-fit: cover;
        }

        .error-box {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(239,68,68,0.16);
            border: 1px solid rgba(239,68,68,0.35);
            color: #fecaca;
            display: inline-block;
        }

        body.dark-mode .error-box {
            background: rgba(239,68,68,0.10);
            color: #991b1b;
            border-color: rgba(239,68,68,0.25);
        }
    </style>
</head>

<body>

<!-- ✅ NAVBAR (ΙΔΙΟ ακριβώς με αυτό που έστειλες) -->
<div class="header">
    <div class="logo" onclick="window.location.href='/home'">CineMatch</div>

    <div class="nav-btns">
        <button class="nav-btn" onclick="window.location.href='/trending'">Trending</button>
        <button class="nav-btn" onclick="window.location.href='/trending-celebrities'">Trending Actors</button>
        <button class="nav-btn" onclick="window.location.href='/upload'">Upload</button>
        <button class="nav-btn" onclick="window.location.href='/actor-match'">Actor Match</button>
        <button class="nav-btn" onclick="window.location.href='/sentiment'">Sentiment Search</button>
        <button class="nav-btn" onclick="window.location.href='/quiz-selection'">Quiz 🎭</button>
        <button class="nav-btn" onclick="toggleDarkMode()">𖤓</button>
        <button class="nav-btn" onclick="location.href='/history'">History</button>

        <!-- αν ΔΕΝ έχεις loggedUser (fallback στο user) -->
        <th:block th:if="${loggedUser == null and user == null}">
            <button class="nav-btn" onclick="window.location.href='/login'">LogIn / SignUp</button>
        </th:block>

        <th:block th:if="${loggedUser != null}">
            <div class="user-combo">
                <button class="user-left" onclick="window.location.href='/profile'">
                    <span th:text="${loggedUser.fullName}">User</span>
                </button>
                <button class="user-right" onclick="window.location.href='/logout'">Logout</button>
            </div>
        </th:block>

        <!-- fallback: αν controller δίνει user -->
        <th:block th:if="${loggedUser == null and user != null}">
            <div class="user-combo">
                <button class="user-left" onclick="window.location.href='/profile'">
                    <span th:text="${user.fullName}">User</span>
                </button>
                <button class="user-right" onclick="window.location.href='/logout'">Logout</button>
            </div>
        </th:block>
    </div>
</div>

<div class="container">
    <h1>🎭 Actor Match</h1>
    <p style="opacity:.85; margin-top: 6px;">
        Upload a selfie and we’ll match your vibe to a famous actor.
    </p>

    <div th:if="${error != null}" class="error-box">
        <span th:text="${error}">Error</span>
    </div>

    <form th:action="@{/actor-match}" method="POST" enctype="multipart/form-data" style="margin-top: 22px;">
        <div style="text-align: left; margin-top: 20px;">
            <label style="font-weight:600;">Upload Image:</label>
            <input id="fileInput" type="file" name="photo" class="upload-input" accept="image/*" required>
        </div>

        <div class="preview-area">
            <img id="previewImage" alt="Preview">
        </div>

        <button class="action-btn" type="submit">🔍 Find My Actor Match</button>
    </form>
</div>

<script>
    // --- Dark Mode (ίδια λογική με person-details) ---
    function toggleDarkMode() {
        const body = document.body;
        const isDark = body.classList.toggle("dark-mode");
        localStorage.setItem("darkMode", isDark);
    }

    window.onload = () => {
        if (localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }
    };

    // --- Image preview ---
    const fileInput = document.getElementById("fileInput");
    const previewImage = document.getElementById("previewImage");

    fileInput.onchange = () => {
        const file = fileInput.files[0];
        if (file) {
            previewImage.src = URL.createObjectURL(file);
            previewImage.style.display = "inline-block";
        } else {
            previewImage.style.display = "none";
        }
    };
</script>

</body>
</html>
