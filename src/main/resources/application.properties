spring.application.name=main
server.port=8888

# TMDB API
tmdb.api.key=${TMDB_API_KEY}
tmdb.api.url=https://api.themoviedb.org/3

# AI API Keys
huggingface.api.key=${HUGGINGFACE_API_KEY}
huggingface.model-url=https://router.huggingface.co/hf-inference/models/dima806/facial_emotions_image_detection
huggingface.actor.model-url=https://router.huggingface.co/hf-inference/models/dima806/facial_emotions_image_detection
gemini.api.key=${GEMINI_API_KEY}
openai.api.key=${OPENAI_API_KEY}

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}


# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Upload Settings
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB